# Systemd user tmpfiles configuration
# Automatically clean up files and subfolders in ~/Downloads older than 30 days (1 month)
#
# Syntax: Type Path Mode UID GID Age Argument
#   d: Ensure directory exists and recursively clean up contents older than Age
#   %h: Expands to user's home directory ($HOME)
#   30d: Time-based threshold (files/folders unmodified & unaccessed for > 30 days)
#
# Type  Path            Mode  UID  GID  Age  Argument
d       %h/Downloads    0755  -    -    30d  -
