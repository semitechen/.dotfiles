# --- Appearance & Theme ---
include current-theme.conf

background_image /home/semitechen/.wallpapers/testbg.png
background_image_layout scaled
background_tint 0.0

# Window Decorations
hide_window_decorations yes
window_padding_width 0

# --- Typography ---
font_family JetBrainsMono Nerd Font
font_size 14.0
disable_ligatures always

# CJK Font Fallback (Chinese, Japanese, Korean characters)
symbol_map U+4E00-U+9FFF,U+3400-U+4DBF,U+20000-U+2A6DF,U+2A700-U+2B73F,U+2B740-U+2B81F,U+2B820-U+2CEAF,U+F900-U+FAFF,U+2F800-U+2FA1F,U+3000-U+303F,U+FF00-U+FFEF WenQuanYi Micro Hei

# --- Mouse & Cursor (Instant - zero animations, zero trails, zero blink) ---
mouse_hide_wait -1.0
cursor_blink_interval 0
cursor_trail 0

# --- Performance & Responsiveness (Instant rendering) ---
repaint_delay 10
input_delay 2
sync_to_monitor yes
enable_audio_bell no
window_alert_on_bell no

# --- Behavior & Scrollback ---
scrollback_lines 10000

# --- Tmux Integration (Hiding Kitty UI to let Tmux handle it) ---
enabled_layouts grid,stack
tab_bar_style hidden
tab_bar_min_tabs 1

# --- Keyboard Pass-through ---
map shift+enter send_text all \x1b[13;2u

# --- System Clipboard (Ctrl+C copies if selection, Ctrl+V pastes) ---
map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# --- Tmux Session & Window Management (Direct Ctrl bindings replacing macOS Cmd) ---
map ctrl+b send_text all \x02s
map ctrl+n send_text all \x02N
map ctrl+t send_text all \x02c
map ctrl+w send_text all \x02&
map ctrl+d send_text all \x02d
map ctrl+[ send_text all \x02p
map ctrl+] send_text all \x02n

# Switch to tmux windows 0-9
map ctrl+0 send_text all \x020
map ctrl+1 send_text all \x021
map ctrl+2 send_text all \x022
map ctrl+3 send_text all \x023
map ctrl+4 send_text all \x024
map ctrl+5 send_text all \x025
map ctrl+6 send_text all \x026
map ctrl+7 send_text all \x027
map ctrl+8 send_text all \x028
map ctrl+9 send_text all \x029

# --- Polish Diacritics (Left Alt + letter for muscle memory continuity) ---
map alt+a send_text all ą
map alt+c send_text all ć
map alt+e send_text all ę
map alt+l send_text all ł
map alt+n send_text all ń
map alt+o send_text all ó
map alt+s send_text all ś
map alt+x send_text all ź
map alt+z send_text all ż

map alt+shift+a send_text all Ą
map alt+shift+c send_text all Ć
map alt+shift+e send_text all Ę
map alt+shift+l send_text all Ł
map alt+shift+n send_text all Ń
map alt+shift+o send_text all Ó
map alt+shift+s send_text all Ś
map alt+shift+x send_text all Ź
map alt+shift+z send_text all Ż
