# --- Appearance & Theme ---
include current-theme.conf

background_image ~/.wallpapers/testbg.png
background_image_layout scaled
background_tint 0.0

# Window Decorations
hide_window_decorations yes
window_padding_width 0
resize_draw_strategy static

# --- Typography ---
font_size 14.0
disable_ligatures always

# --- Mouse & Cursor ---
mouse_hide_wait -1.0
cursor_blink_interval 0

# --- Behavior & Scrollback ---
scrollback_lines 10000

# --- Tmux Integration (Hiding Kitty UI to let Tmux handle it) ---
enabled_layouts grid,stack
tab_bar_style hidden
tab_bar_min_tabs 1

# --- Keyboard Pass-through (Send tmux commands via prefix C-b) ---
map shift+enter send_text all \x1b[13;2u
map cmd+b send_text all \x02s
map cmd+n send_text all \x02N
map cmd+t send_text all \x02c
map cmd+w send_text all \x02&
map cmd+d send_text all \x02d
map cmd+[ send_text all \x02p
map cmd+] send_text all \x02n

# Switch to windows 0-9
map cmd+0 send_text all \x020
map cmd+1 send_text all \x021
map cmd+2 send_text all \x022
map cmd+3 send_text all \x023
map cmd+4 send_text all \x024
map cmd+5 send_text all \x025
map cmd+6 send_text all \x026
map cmd+7 send_text all \x027
map cmd+8 send_text all \x028
map cmd+9 send_text all \x029

# --- macOS Specific ---
macos_option_as_alt yes
# Note: macos-icon is not supported via kitty.conf

# Polish Characters (Alt/Option + letter)
map alt+a send_text all ą
map alt+c send_text all ć
map alt+e send_text all ę
map alt+l send_text all ł
map alt+n send_text all ń
map alt+o send_text all ó
map alt+s send_text all ś
map alt+x send_text all ź
map alt+z send_text all ż

# Uppercase Polish Characters (Alt/Option + Shift + letter)
map alt+shift+a send_text all Ą
map alt+shift+c send_text all Ć
map alt+shift+e send_text all Ę
map alt+shift+l send_text all Ł
map alt+shift+n send_text all Ń
map alt+shift+o send_text all Ó
map alt+shift+s send_text all Ś
map alt+shift+x send_text all Ź
map alt+shift+z send_text all Ż
