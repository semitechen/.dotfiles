# ~/.config/paru/paru.conf
# Paru configuration for Arch Linux (Framework 13 Pro)

[options]
PgpFetch
Devel
Provides
DevelSuffixes = -git -cvs -svn -bzr -darcs -always -hg -fossil
BottomUp
CleanAfter
SudoLoop
BatchInstall
CombinedUpgrade

# Zero-prompt installation: skip PKGBUILD review & diff prompts
SkipReview

# Use the real pacman binary internally to avoid wrapper recursion
[bin]
Pacman = /usr/bin/pacman
