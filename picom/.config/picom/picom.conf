# Instant rendering configuration - zero transitions, zero animations, zero fading

# Fading: completely disabled
fading = false;
fade-in-step = 1.0;
fade-out-step = 1.0;
fade-delta = 0;
no-fading-openclose = true;
no-fading-destroyed-argb = true;

# Shadows: disabled for instant draw
shadow = false;

# Animations: disabled
animations = false;

# Window type settings
wintypes:
{
  tooltip = { fade = false; shadow = false; opacity = 1.0; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; fade = false; shadow = false; };
  dropdown_menu = { opacity = 1.0; fade = false; shadow = false; };
};

# Rendering backend & VSync for tear-free display without compositing latency
backend = "glx";
vsync = true;
use-damage = true;
