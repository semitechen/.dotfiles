# /etc/X11/xorg.conf.d/00-keyboard.conf
# System-wide keyboard configuration for Arch Linux on Framework 13 Pro
# Enables standard Polish programmer layout (Right Alt acts as AltGr, Left Alt acts as Alt/Meta)
# Copy to /etc/X11/xorg.conf.d/00-keyboard.conf:
#   sudo cp ~/.dotfiles/xorg/00-keyboard.conf /etc/X11/xorg.conf.d/00-keyboard.conf

Section "InputClass"
        Identifier "system-keyboard"
        MatchIsKeyboard "on"
        Option "XkbLayout" "pl"
EndSection
