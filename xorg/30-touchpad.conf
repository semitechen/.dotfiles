# /etc/X11/xorg.conf.d/30-touchpad.conf
# System-wide touchpad configuration for Arch Linux on Framework 13 Pro
# Enables tap-to-click, natural scrolling, and clickfinger behavior (1 finger: left, 2 fingers: right, 3 fingers: middle)
# Copy to /etc/X11/xorg.conf.d/30-touchpad.conf:
#   sudo cp ~/.dotfiles/xorg/30-touchpad.conf /etc/X11/xorg.conf.d/30-touchpad.conf

Section "InputClass"
    Identifier "touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "on"
    Option "ClickMethod" "clickfinger"
    # lrm = 1 palec: Lewy (1), 2 palce: Prawy (3), 3 palce: Środkowy (2)
    Option "ClickfingerMap" "lrm"
    # Wymuszenie logicznej kolejności przycisków:
    Option "ButtonMapping" "1 2 3 4 5 6 7"
    Option "NaturalScrolling" "true"
EndSection
