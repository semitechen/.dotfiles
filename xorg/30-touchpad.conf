# /etc/X11/xorg.conf.d/30-touchpad.conf
# System-wide touchpad configuration for Arch Linux on Framework 13 Pro
# Enables tap-to-click, natural scrolling, palm rejection, and clickfinger behavior
# Copy to /etc/X11/xorg.conf.d/30-touchpad.conf:
#   sudo cp ~/.dotfiles/xorg/30-touchpad.conf /etc/X11/xorg.conf.d/30-touchpad.conf

Section "InputClass"
    Identifier "touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"

    # Tap-to-click
    Option "Tapping" "on"
    # Tapping button map: 1 finger = Left (l), 2 fingers = Right (r), 3 fingers = Middle (m)
    Option "TappingButtonMap" "lrm"
    # Tap-and-drag (double-tap and hold to drag windows / select text)
    Option "TappingDrag" "true"

    # Physical click method: count fingers anywhere on pad (like macOS) instead of bottom corner zones
    # 1 finger click = Left (1), 2 fingers click = Right (3), 3 fingers click = Middle (2)
    Option "ClickMethod" "clickfinger"

    # Scrolling
    Option "NaturalScrolling" "true"
    Option "ScrollMethod" "twofinger"

    # Palm rejection: disable touchpad cursor jumps while typing on the keyboard
    Option "DisableWhileTyping" "true"

    # Standard logical button order (1=left, 2=middle, 3=right)
    Option "ButtonMapping" "1 2 3 4 5 6 7"
EndSection
